<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Bank 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--bg:#fff3d6;--y:#ffd93d;--p:#ff6b9d;--c:#4ecdc4;--v:#9b5de5;--g:#7bd88f;--r:#ff5a4f}
*{box-sizing:border-box}
body{margin:0;font:600 16px 'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(#0002 1.5px,transparent 1.5px) 0 0/22px 22px;padding-bottom:96px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
h1,h2,h3{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0}
h3{font-size:18px}
.top{position:sticky;top:0;z-index:5;background:var(--p);border-bottom:4px solid var(--ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-size:22px;transform:rotate(-1.5deg)}
.coin{background:var(--y);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;box-shadow:3px 3px 0 var(--ink);font-weight:700;white-space:nowrap}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin:16px 0}
.big{font:400 40px Bungee,Impact,sans-serif;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:16px 0 0}
button,input,select,textarea{font:inherit;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:18px;height:18px;min-width:0;padding:0;accent-color:var(--v)}
button{cursor:pointer;background:var(--y);box-shadow:3px 3px 0 var(--ink);font-weight:700}
button:active{transform:translate(3px,3px);box-shadow:none}
button:disabled{opacity:.4;cursor:not-allowed}
button.g{background:var(--g)}button.r{background:var(--r)}button.c{background:var(--c)}
textarea{width:100%;min-height:80px}input{min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--c);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.win{background:var(--y);box-shadow:2px 2px 0 var(--ink)}
.badge{border:2px solid var(--ink);border-radius:8px;padding:1px 8px;font-size:13px;text-transform:uppercase;background:var(--g);white-space:nowrap}
.badge.locked{background:var(--y)}.badge.settled{background:var(--c)}.badge.void{background:#ccc}.badge.super{background:var(--v);color:#fff}.badge.helper{background:var(--p)}
.ln{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed #0003;font-size:15px}
.mut{opacity:.6;font-size:14px}.pos{color:#0a7d3b}.neg{color:#c4271d}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;justify-content:center;padding:10px;background:var(--v);border-top:4px solid var(--ink)}
nav button{flex:1;max-width:110px;padding:5px 2px;font-size:11px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:20px}nav button.on{background:var(--p)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:30;background:var(--g);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:8px 16px;display:none;max-width:90vw}
#toast.err{background:var(--r)}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#modal .card{max-width:380px;width:100%;margin:0;background:var(--y)}#mm{font-size:18px;line-height:1.35}#modal input{width:100%;margin-top:12px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #0003}.lb b{font:400 20px Bungee;width:44px}.lb span{flex:1}
.tv .lb{font-size:26px;padding:12px 0}.tv .lb b{font-size:28px;width:70px}.tv h2{font-size:34px}.tv .ln{font-size:20px}
#flash{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:25;display:none;background:var(--y);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:12px 18px;font-size:18px;max-width:92vw;text-align:center}
.cf{position:absolute;top:-20px;width:10px;height:14px;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#cer{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 0%,#5b2bb0,#1c0f3d);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow:hidden}
#cer h2{font-family:Bungee,Impact,sans-serif;font-weight:400}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:340px;width:100%;max-width:560px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.who{opacity:0;transform:translateY(24px);transition:.7s;text-align:center;margin-bottom:8px}.who.show{opacity:1;transform:none}
.blk{width:100%;height:0;overflow:hidden;border:3px solid #111;border-bottom:0;border-radius:12px 12px 0 0;color:#111;font:400 44px Bungee,Impact,sans-serif;text-align:center;padding-top:8px;transition:height 1.2s cubic-bezier(.2,.9,.3,1.15)}
#sheet{display:none}
@media print{body{background:#fff;padding:0}body>*:not(#sheet){display:none!important}#sheet{display:block;font:14px 'Space Grotesk',Arial,sans-serif;color:#000}#sheet h1{font-size:26px;margin:0 0 4px}#sheet h2{font-size:18px;margin:18px 0 6px}#sheet table{width:100%;border-collapse:collapse}#sheet td,#sheet th{border-bottom:1px solid #999;padding:4px 6px;text-align:left}@page{margin:14mm}}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #111;background:#7bd88f;display:inline-block}.dot.off{background:#ff5a4f}.top{flex-wrap:wrap}
</style></head>
<body><div id="app"></div><div id="toast"></div><div id="cer"></div><div id="flash"></div><div id="sheet"></div>
<div id="modal"><div class="card"><div id="mm"></div><input id="mi" autocomplete="off"><div class="row" style="justify-content:flex-end"><button id="mn">Cancel</button><button id="my" class="g">Confirm</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://eudtnaprxmjbhrkhupbg.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1ZHRuYXByeG1qYmhya2h1cGJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1Nzc5ODcsImV4cCI6MjExMDE1Mzk4N30.iv8E6kXyKNiIVvKSQuR1i6jTdRO4cc_QzvyV92FtebA';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GAMES=['Flip 7','Exploding Kittens','Blackjack','Least Count','Mafia','Trivia Quiz',"Don't Say Same Thing",'Whole Party','Other'];
const START=1000, TV=new URLSearchParams(location.search).has('tv');
let booted=false,seen=null,cerT=[],live=false,gameSel='All',AC=null,muted=localStorage.getItem('pb_mute')==='1';
let S={players:[],bank:0,bets:[],entries:[],ledger:[],ev:{ended:false,prizes:[],final:null,max_stake:500}},tab='home',timer,code=null,role=null,viewP=null,Q='';
const nm=id=>id?(S.players.find(p=>p.id===id)?.name||'?'):'🏦 Bank';
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const sg=n=>`<span class="${n>=0?'pos':'neg'}">${n>0?'+':''}${n}</span>`;
const byName=()=>[...S.players].sort((a,b)=>a.name.localeCompare(b.name));
const ranked=()=>S.ev.ended&&S.ev.final?S.ev.final:S.players.map(p=>({id:p.id,name:p.name,balance:p.balance,loan:p.loan||0,net:p.balance-(p.loan||0)})).sort((a,b)=>b.net-a.net||a.name.localeCompare(b.name));

function ask(msg,o={}){return new Promise(res=>{
  const M=$('#modal'),inp=$('#mi'),ok=$('#my');$('#mm').innerHTML=msg;
  inp.style.display=o.type?'block':'none';inp.value='';inp.placeholder=o.type?'Type '+o.type+' to confirm':'';
  ok.textContent=o.ok||'Confirm';ok.className=o.cls||'g';ok.disabled=!!o.type;
  inp.oninput=()=>{ok.disabled=inp.value.trim().toUpperCase()!==o.type};
  const done=v=>{M.style.display='none';res(v)};
  ok.onclick=()=>done(true);$('#mn').onclick=()=>done(false);M.onclick=e=>{if(e.target===M)done(false)};
  M.style.display='flex';if(o.type)inp.focus()})}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}
async function rpc(fn,args={}){const {error}=await sb.rpc(fn,{p_code:code,...args});
  if(error){if(/Wrong code/.test(error.message)){lock();toast('Code no longer valid — unlock again',1)}else toast(error.message,1);return false}
  toast('Done ✔');await load();return true}

async function init(){
  const saved=localStorage.getItem('pb_code');
  if(saved&&!TV){const {data}=await sb.rpc('check_code',{p_code:saved});if(data){code=saved;role=data}else localStorage.removeItem('pb_code')}
  await load();
  sb.channel('party').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(timer);timer=setTimeout(load,300)}).subscribe(st=>setLive(st==='SUBSCRIBED'));
  setInterval(()=>{if(!live)load()},8000);
  if(TV&&navigator.wakeLock){const wl=()=>navigator.wakeLock.request('screen').catch(()=>{});wl();document.addEventListener('visibilitychange',()=>{if(!document.hidden)wl()})}
}
async function load(){
  const [p,b,bt,e,l,ev]=await Promise.all([sb.from('players').select('*'),sb.from('bank').select('balance').single(),
    sb.from('bets').select('*').order('id',{ascending:false}),sb.from('entries').select('*'),
    sb.from('ledger').select('*').order('id',{ascending:false}).limit(1000),sb.from('event').select('*').single()]);
  const was=S.ev.ended;
  S.players=p.data||[];S.bank=b.data?.balance??0;S.bets=bt.data||[];S.entries=e.data||[];S.ledger=l.data||[];
  if(ev.data)S.ev=ev.data;
  render();checkSettled();
  if(booted&&!was&&S.ev.ended)ceremony();
  booted=true;
}

/* ---------- actions ---------- */
window.unlock=async()=>{const c=$('#sc').value;const {data,error}=await sb.rpc('check_code',{p_code:c});
  if(error)return toast('Wrong code',1);code=c;role=data;localStorage.setItem('pb_code',c);toast('Unlocked ✔');render()};
window.lock=()=>{code=null;role=null;localStorage.removeItem('pb_code');if(tab==='host')tab='home';render()};
window.openP=id=>{if(!S.players.find(p=>p.id===id))return;viewP=id;tab='people';render();scrollTo(0,0)};
window.addp=async()=>{const names=$('#np').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!names.length)return toast('Type at least one name',1);if(await rpc('add_players',{p_names:names}))$('#np').value=''};
window.rmp=async id=>{if(await ask('Remove <b>'+esc(nm(id))+'</b> from the party?',{ok:'Remove',cls:'r'}))rpc('remove_player',{p_id:id})};
const picked=()=>[...document.querySelectorAll('input[id^=pk]:checked')].map(x=>+x.id.slice(2));
window.pickAll=v=>document.querySelectorAll('input[id^=pk]').forEach(x=>x.checked=v);
window.preset=(d,r)=>{$('#ad').value=d;$('#ar').value=r};
window.adj=async()=>{const ids=picked(),d=parseInt($('#ad').value);
  if(!ids.length)return toast('Tick at least one player',1);if(!d)return toast('Enter an amount',1);
  if(await ask(`${d>0?'Give':'Deduct'} <b>${Math.abs(d)}</b> tokens ${d>0?'to':'from'} <b>${ids.length}</b> player(s)?`,{ok:d>0?'Give':'Deduct',cls:d>0?'g':'r'}))
    if(await rpc('adjust',{p_players:ids,p_delta:d,p_reason:$('#ar').value.trim()}))pickAll(false)};
function lastAdj(){const r=S.ledger.filter(l=>l.adj_batch&&!l.undone);if(!r.length)return null;
  const bt=Math.max(...r.map(l=>l.adj_batch)),rows=r.filter(l=>l.adj_batch===bt),bk=rows.some(x=>!x.player_id);
  return{txt:`${esc(rows[0].reason)} · ${bk?'Bank':rows.length+' player(s)'} · ${sg(rows[0].delta)}`}}
window.undoAdj=async()=>{const a=lastAdj();if(!a)return;if(await ask('Undo the last adjustment?<div class="mut">'+a.txt+'</div>',{ok:'Undo it',cls:'r'}))rpc('undo_adjust')};
window.bankAdj=async s=>{const d=parseInt($('#bka').value);if(!(d>0))return toast('Enter an amount',1);
  if(await ask(`${s>0?'Add':'Remove'} <b>${d}</b> tokens ${s>0?'to':'from'} the bank?`,{ok:s>0?'Add':'Remove',cls:s>0?'g':'r'}))
    if(await rpc('bank_adjust',{p_delta:s*d,p_reason:$('#bkr').value.trim()})){$('#bka').value='';$('#bkr').value=''}};
window.loan=async()=>{const id=+$('#lp').value;if(!id)return toast('No eligible player right now',1);
  if(await ask(`Give <b>${esc(nm(id))}</b> their one-time <b>100</b> token loan from the bank?<div class="mut">It counts against their ranking until repaid. Each player can only get it once.</div>`,{ok:'Give 100'}))rpc('rescue_loan',{p_player:id})};
window.repay=async id=>{if(await ask(`Take back what <b>${esc(nm(id))}</b> can repay of the loan?`,{ok:'Repay'}))rpc('repay_loan',{p_player:id})};
window.mkduel=async()=>{const s=parseInt($('#vs').value),a=+$('#va').value,b=$('#vb').value;
  if(!(s>0))return toast('Enter a stake',1);
  const vsBank=b==='bank',t=$('#vt').value.trim()||(nm(a)+' vs '+(vsBank?'Bank':nm(+b)));
  const ok=vsBank?await rpc('create_bank_bet',{p_game:$('#vg').value,p_title:t,p_player:a,p_stake:s})
    :await rpc('create_pvp',{p_game:$('#vg').value,p_title:t,p_a:a,p_b:+b,p_stake:s});
  if(ok)$('#vt').value=''};
window.settle=async(id,i)=>{const b=S.bets.find(x=>x.id===id);
  if(await ask('<b>'+esc(b.options[i])+'</b> wins?<div class="mut">Tokens are paid out right away.</div>',{ok:'Yes, settle',cls:'g'}))rpc('settle_bet',{p_bet:id,p_win:i})};
window.voidB=async id=>{if(await ask('Void this bet and refund everyone?',{ok:'Void & refund',cls:'r'}))rpc('void_bet',{p_bet:id})};
window.undoB=async id=>{if(await ask('Undo the result? Payouts will be reversed.',{ok:'Undo result',cls:'r'}))rpc('reopen_bet',{p_bet:id})};
window.clearPz=()=>{[1,2,3].forEach(i=>$('#pz'+i).value='');saveEv()};
window.saveEv=()=>rpc('set_event',{p_prizes:[1,2,3].map(i=>$('#pz'+i).value.trim()),p_max_stake:parseInt($('#ms').value)||0});
window.endEv=async end=>{if(await ask(end?'End the event and freeze the final leaderboard?<div class="mut">New bets are blocked. All live bets must be settled first.</div>':'Reopen the event?',{ok:end?'End event':'Reopen',cls:end?'r':'g'}))rpc('end_event',{p_end:end})};
window.resetEv=async keep=>{
  if(await ask(keep?'Reset <b>all tokens, bets and history</b>?<div class="mut">Players stay and go back to the starting tokens.</div>':'Delete <b>everything</b> — players, tokens, bets and history?<div class="mut">You will add players again from scratch.</div>',{ok:keep?'Reset event':'Delete everything',cls:'r',type:'RESET'}))
    rpc('reset_event',{p_keep_players:keep})};
function dl(name,rows){const c=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=name;a.click()}
window.bkBal=()=>dl('party-balances.csv',[['rank','name','balance','loan','net'],...ranked().map((p,i)=>[i+1,p.name,p.balance,p.loan,p.net])]);
window.bkLed=()=>dl('party-ledger.csv',[['time','who','change','reason'],...[...S.ledger].reverse().map(l=>[new Date(l.created_at).toLocaleString(),nm(l.player_id),l.delta,l.reason])]);

/* ---------- views ---------- */
function ctl(b){
  if(b.status==='void')return'';
  if(b.status==='settled')return role?`<div class="row"><button onclick="undoB(${b.id})">↩ Undo result</button></div>`:'';
  return`<div class="row">${b.options.map((o,i)=>`<button class="g" onclick="settle(${b.id},${i})">👑 ${esc(o)} wins</button>`).join('')}<button class="r" onclick="voidB(${b.id})">Void</button></div>`;
}
function betCard(b,host){
  const es=S.entries.filter(e=>e.bet_id===b.id),st=b.stake??es[0]?.stake??0;
  const chips=b.options.map((o,i)=>`<span class="chip${b.winning===i?' win':''}">${b.winning===i?'👑 ':''}${esc(o)}</span>`).join('<b>⚔️</b>');
  const sub=b.mode==='bank'?`🏦 vs Bank · ${st}🪙 stake · win = ${st*2}🪙`:`⚔️ Duel · ${st}🪙 each · winner takes ${st*2}🪙`;
  const list=b.status==='settled'?es.map(e=>`<div class="ln"><span>${esc(nm(e.player_id))} · ${e.stake}🪙 ⇒ <b>${e.payout??0}</b></span></div>`).join(''):'';
  return`<div class="card"><div class="row" style="justify-content:space-between;margin:0"><h3>${esc(b.game)}</h3><span class="badge ${b.status}">${b.status}</span></div><div style="margin-top:4px">${esc(b.title)}</div><div class="mut">${sub}</div><div class="row">${chips}</div>${list?`<div style="margin-top:8px">${list}</div>`:''}${host?ctl(b):''}</div>`;
}
const lbRow=(p,i)=>`<div class="lb" onclick="openP(${p.id})" style="cursor:pointer"><b>${['🥇','🥈','🥉'][i]||'#'+(i+1)}</b><span>${esc(p.name)}${p.loan?` <small class="mut">🆘 owes ${p.loan}</small>`:''}</span><b style="width:auto">${p.balance}🪙</b><small>${sg(p.net-START)}</small></div>`;
function podium(){if(!S.ev.ended)return'';const r=ranked().slice(0,3),pr=S.ev.prizes||[];
  return`<div class="card" style="background:var(--g)"><h2>🏁 Final results</h2>${r.map((p,i)=>`<div class="lb"><b>${['🥇','🥈','🥉'][i]}</b><span>${esc(p.name)}${pr[i]?`<div class="mut">🎁 ${esc(pr[i])}</div>`:''}</span><b style="width:auto">${p.net}🪙</b></div>`).join('')}<div class="row"><button class="c" onclick="ceremony()">🏅 Replay ceremony</button></div></div>`}
const top10=()=>`<div class="card" style="background:var(--y)"><h2>🏆 Top 10</h2>${ranked().slice(0,10).map(lbRow).join('')||'<div class="mut">Waiting for players…</div>'}${S.players.some(p=>p.loan)?'<div class="mut" style="margin-top:6px">Ranked by net = tokens − loans</div>':''}</div>`;
const activity=n=>`<div class="card"><h3>Latest activity</h3>${S.ledger.slice(0,n).map(l=>`<div class="ln"><span>${esc(nm(l.player_id))}: ${esc(l.reason)}<div class="mut">${tm(l.created_at)}</div></span><b>${sg(l.delta)}</b></div>`).join('')||'<div class="mut">Nothing yet</div>'}</div>`;
function pstats(id){
  const rows=S.entries.filter(e=>e.player_id===id).map(e=>({e,b:S.bets.find(b=>b.id===e.bet_id)})).filter(x=>x.b&&x.b.status==='settled')
    .sort((a,c)=>c.b.id-a.b.id).map(x=>({b:x.b,win:(x.e.payout||0)>0,net:(x.e.payout||0)-x.e.stake}));
  let streak=0;for(const r of rows){if(r.win===rows[0].win)streak++;else break}
  return{rows,n:rows.length,w:rows.filter(r=>r.win).length,net:rows.reduce((a,r)=>a+r.net,0),streak,sw:rows[0]?.win}}
function pdetail(id){const p=S.players.find(x=>x.id===id),st=pstats(id);
  return`<div class="card" style="background:var(--c)"><div class="row" style="justify-content:space-between;margin:0"><h2>${esc(p.name)}</h2><button onclick="viewP=null;render()">✕ Close</button></div>
  <div class="big" style="margin-top:8px">${p.balance}🪙</div>${p.loan?`<div class="mut" style="opacity:.8">🆘 owes ${p.loan} · net ${p.balance-p.loan}</div>`:''}
  <div class="row"><span class="chip" style="background:#fff">Played ${st.n}</span><span class="chip" style="background:#fff">Won ${st.w}</span><span class="chip" style="background:#fff">Lost ${st.n-st.w}</span><span class="chip" style="background:#fff">Bets net ${sg(st.net)}</span>${st.streak>1?`<span class="chip" style="background:#fff">${st.sw?'🔥 '+st.streak+' wins in a row':'🧊 '+st.streak+' losses in a row'}</span>`:''}</div>

function ecoData(){
  const cats={},bankRows=S.ledger.filter(l=>!l.player_id);
  const cat=r=>/^Stake from/.test(r)?'Player stakes in':/^Payout/.test(r)?'Payouts to winners':/^Refund/.test(r)?'Refunds':/^Result reversed/.test(r)?'Reversed results':/^Rescue loan/.test(r)?'Rescue loans out':/^Loan repaid/.test(r)?'Loans repaid in':/^Undo/.test(r)?'Undone adjustments':'Host top-ups / removals';
  let bin=0,bout=0;bankRows.forEach(l=>{const k=cat(l.reason||'');cats[k]=(cats[k]||0)+l.delta;if(l.delta>=0)bin+=l.delta;else bout+=-l.delta});
  const vs={};S.bets.filter(b=>b.mode==='bank'&&b.status==='settled').forEach(b=>S.entries.filter(e=>e.bet_id===b.id).forEach(e=>{vs[e.player_id]=(vs[e.player_id]||0)+(e.payout||0)-e.stake}));
  const pair={};let duels=0;
  S.bets.filter(b=>b.mode==='pvp'&&b.status==='settled').forEach(b=>{const es=S.entries.filter(e=>e.bet_id===b.id),w=es.find(e=>(e.payout||0)>0),l=es.find(e=>!((e.payout||0)>0));
    if(!w||!l)return;duels++;const a=w.player_id,c=l.player_id,k=Math.min(a,c)+'|'+Math.max(a,c);pair[k]=(pair[k]||0)+(a<c?l.stake:-l.stake)});
  const flows=Object.entries(pair).filter(([,v])=>v!==0).map(([k,v])=>{const [lo,hi]=k.split('|').map(Number);return v>0?{from:hi,to:lo,amt:v}:{from:lo,to:hi,amt:-v}}).sort((a,b)=>b.amt-a.amt);
  const escrow=S.entries.filter(e=>{const b=S.bets.find(x=>x.id===e.bet_id);return b&&b.mode==='pvp'&&(b.status==='open'||b.status==='locked')}).reduce((a,e)=>a+e.stake,0);
  const adjR=S.ledger.filter(l=>l.player_id&&l.adj_batch&&!l.undone);
  return{cats,bin,bout,vs,flows,duels,escrow,
    bonus:adjR.filter(l=>l.delta>0).reduce((a,l)=>a+l.delta,0),penalty:adjR.filter(l=>l.delta<0).reduce((a,l)=>a+l.delta,0),

  const ed=[];

function awards(){
  const st={};S.players.forEach(p=>st[p.id]={name:p.name,staked:0,duelW:0,bankNet:0,bestWin:0,ser:[]});
  [...S.bets].filter(b=>b.status==='settled').sort((a,b)=>a.id-b.id).forEach(b=>S.entries.filter(e=>e.bet_id===b.id).forEach(e=>{
    const s=st[e.player_id];if(!s)return;const win=(e.payout||0)>0,net=(e.payout||0)-e.stake;
    s.staked+=e.stake;if(b.mode==='pvp'&&win)s.duelW++;if(b.mode==='bank')s.bankNet+=net;if(win&&net>s.bestWin)s.bestWin=net;s.ser.push(win)}));
  const run={},mn={};
  if(S.ledger.length<1000)[...S.ledger].reverse().forEach(l=>{if(!l.player_id||!st[l.player_id])return;const id=l.player_id;run[id]=(run[id]||0)+l.delta;mn[id]=Math.min(mn[id]??Infinity,run[id])});
  const L=Object.entries(st).map(([id,s])=>{let w=0,l=0,cw=0,cl=0;s.ser.forEach(x=>{if(x){cw++;cl=0}else{cl++;cw=0}w=Math.max(w,cw);l=Math.max(l,cl)});
    const p=S.players.find(x=>x.id===+id);return{...s,maxW:w,maxL:l,comeback:mn[id]!=null?p.balance-mn[id]:0}});
  const out=[],pick=(icon,title,key,min,fmt,low)=>{const c=L.filter(x=>low?x[key]<-min+1:x[key]>=min).sort((a,b)=>low?a[key]-b[key]:b[key]-a[key])[0];if(c)out.push({icon,title,name:c.name,detail:fmt(c)})};
  const r=ranked();if(r.length&&(r[0].net!==START||S.ev.ended))out.push({icon:'👑',title:'Champion',name:r[0].name,detail:r[0].net+' tokens'});
  pick('🎰','High Roller','staked',1,c=>c.staked+' tokens staked');
  pick('🚀','Biggest Win','bestWin',1,c=>'+'+c.bestWin+' in one bet');
  pick('🔥','Hot Streak','maxW',2,c=>c.maxW+' wins in a row');
  pick('🧊','Ice Cold','maxL',2,c=>c.maxL+' losses in a row');
  pick('🦈','Bank Buster','bankNet',1,c=>'+'+c.bankNet+' from the Bank');

  pick('⚔️','Duel Master','duelW',1,c=>c.duelW+' duel wins');
  pick('🎢','Comeback King','comeback',100,c=>'climbed back +'+c.comeback);
  return out}

  x.textAlign='center';x.fillStyle='#111';x.font='600 26px "Space Grotesk", sans-serif';x.fillText(`${r.length} players · Bank ${S.bank} tokens · net = tokens − loans`,W/2,H-50);return c}
async function drawAwards(){
  const a=awards(),rh=124,H=230+Math.max(1,a.length)*rh+90,{c,x,W}=await canvasFor(H,'AWARDS');
  a.forEach((it,i)=>{const y=210+i*rh;x.fillStyle=['#ffd93d','#4ecdc4','#ff6b9d','#7bd88f','#9b5de5'][i%5];rr(x,40,y,W-80,rh-14,18);x.fill();x.lineWidth=4;x.strokeStyle='#111';x.stroke();
    x.textAlign='left';x.fillStyle='#111';x.font='56px sans-serif';x.fillText(it.icon,64,y+72);

    x.textAlign='right';x.font='700 38px "Space Grotesk", sans-serif';x.fillText(fit(x,it.name,380),W-64,y+66)});
  if(!a.length){x.textAlign='center';x.fillStyle='#111';x.font='600 30px "Space Grotesk", sans-serif';x.fillText('No awards yet',W/2,260)}return c}
window.shareImg=async kind=>{const c=await(kind==='awards'?drawAwards():kind==='mesh'?drawMesh():drawBoard());
  c.toBlob(async blob=>{const f=new File([blob],`party-${kind}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Party Bank results'});return}catch(e){if(e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click();toast('Image saved — attach it in WhatsApp')},'image/png')};
window.printSheet=()=>{const r=ranked(),pr=S.ev.prizes||[],aw=awards(),d=ecoData();
  $('#sheet').innerHTML=`<h1>Party Bank — ${S.ev.ended?'Final results':'Standings'}</h1><div>${new Date().toLocaleString()}</div>
  <h2>Leaderboard</h2><table><tr><th>#</th><th>Player</th><th>Tokens</th><th>Loan</th><th>Net</th><th>vs start</th></tr>${r.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}${i<3&&pr[i]?' — 🎁 '+esc(pr[i]):''}</td><td>${p.balance}</td><td>${p.loan||''}</td><td><b>${p.net}</b></td><td>${p.net-START>0?'+':''}${p.net-START}</td></tr>`).join('')}</table>
  ${aw.length?`<h2>Awards</h2><table>${aw.map(a=>`<tr><td>${a.icon} ${a.title}</td><td>${esc(a.name)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</table>`:''}
  <h2>Economy</h2><table><tr><td>Players hold</td><td>${d.held}</td></tr><tr><td>Bank holds</td><td>${S.bank}</td></tr><tr><td>Duels played</td><td>${d.duels}</td></tr><tr><td>Bets vs Bank settled</td><td>${d.bankBets}</td></tr><tr><td>Bonuses / penalties</td><td>+${d.bonus} / ${d.penalty}</td></tr></table>`;

/* ---------- celebrations ---------- */
function confetti(box,n=70){const cols=['#ffd93d','#ff6b9d','#4ecdc4','#9b5de5','#7bd88f','#ff5a4f'];
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';
    s.style.cssText=`left:${Math.random()*100}%;background:${cols[i%6]};animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()*.8}s`;
    box.appendChild(s);setTimeout(()=>s.remove(),7000)}}
function ceremony(){
  const r=ranked().slice(0,3),pr=S.ev.prizes||[],C=$('#cer');if(!r.length)return;cerT.forEach(clearTimeout);cerT=[];
  const meta=[{m:'🥇',c:'#ffd93d',h:230},{m:'🥈',c:'#cfd8dc',h:165},{m:'🥉',c:'#cd7f32',h:115}],cols=[1,0,2].filter(i=>r[i]);
  C.innerHTML=`<h2 style="font-size:28px;text-align:center">🏅 MEDAL CEREMONY</h2><div style="opacity:.8;margin:6px 0 18px">${S.ev.ended?'And the winners are…':'Current top 3'}</div>
  <div class="pod">${cols.map(i=>`<div class="step"><div class="who" id="w${i}"><div style="font-size:46px">${meta[i].m}</div><div style="font:400 22px Bungee,Impact,sans-serif;word-break:break-word">${esc(r[i].name)}</div><div>${r[i].net}🪙</div>${pr[i]?`<div style="color:#ffd93d">🎁 ${esc(pr[i])}</div>`:''}</div><div class="blk" id="b${i}" style="background:${meta[i].c}">${i+1}</div></div>`).join('')}</div>
  <div class="row" style="margin-top:22px"><button id="cx">Close</button><button id="cr" class="c">Replay</button></div>`;
  C.style.display='flex';
  $('#cx').onclick=()=>{C.style.display='none';cerT.forEach(clearTimeout)};$('#cr').onclick=ceremony;
  [2,1,0].filter(i=>r[i]).forEach((i,k)=>cerT.push(setTimeout(()=>{const b=$('#b'+i),w=$('#w'+i);if(!b)return;b.style.height=meta[i].h+'px';w.classList.add('show');if(i===0){confetti(C,90);sfx.gold()}else sfx.step()},700+k*2200)))}
function flash(b){
  const es=S.entries.filter(e=>e.bet_id===b.id),st=b.stake??es[0]?.stake??0,w=b.options[b.winning];let t;
  if(b.options.length===2&&b.mode==='bank')t=b.winning===0?`🎉 <b>${esc(w)}</b> beat the Bank! +${st}🪙`:`🏦 The Bank beat <b>${esc(b.options[0])}</b> · −${st}🪙`;
  else if(b.options.length===2)t=`🎉 <b>${esc(w)}</b> beat ${esc(b.options[1-b.winning])}! +${st}🪙`;
  else t=`🏁 <b>${esc(w)}</b> won: ${esc(b.title)}`;
  const pw=b.mode==='bank'&&b.options.length===2?b.winning===0:true;pw?sfx.win():sfx.lose();
  const F=$('#flash');F.innerHTML=t;F.style.display='block';confetti(F,30);clearTimeout(F._t);F._t=setTimeout(()=>F.style.display='none',5000)}
function checkSettled(){const cur=S.bets.filter(b=>b.status==='settled');
  if(seen)cur.filter(b=>!seen.has(b.id)).forEach(flash);seen=new Set(cur.map(b=>b.id))}

/* ---------- status dot, sound, history, game board ---------- */
function setLive(v){live=v;const d=$('#dot');if(d){d.className='dot'+(v?'':' off');d.title=v?'Live updates on':'Reconnecting…'}}
const dotH=()=>`<span id="dot" class="dot${live?'':' off'}" title="${live?'Live updates on':'Reconnecting…'}"></span>`;
const sndH=()=>`<button id="snd" style="padding:2px 8px;box-shadow:2px 2px 0 var(--ink)" onclick="toggleMute()" title="Sound">${muted?'🔇':'🔊'}</button>`;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
document.addEventListener('pointerdown',audio);
function tone(f,t,d,type='triangle',v=.16){const a=AC;if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.05)}
const sfx={win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.28)),lose:()=>[392,330,262].forEach((f,i)=>tone(f,i*.16,.3,'sawtooth',.07)),
  step:()=>{tone(392,0,.3);tone(523,.12,.4)},gold:()=>{[523,523,523,659,784,1047].forEach((f,i)=>tone(f,i*.14,.35));[1047,1319,1568].forEach((f,i)=>tone(f,.95+i*.12,.6))}};
window.toggleMute=()=>{muted=!muted;localStorage.setItem('pb_mute',muted?'1':'0');if(!muted){audio();tone(880,0,.15)}render()};
function hist(id){let cur=id==null?S.bank:S.players.find(p=>p.id===id)?.balance;if(cur==null)return[];
  const out=[cur];for(const l of S.ledger){if(id==null?l.player_id:l.player_id!==id)continue;cur-=l.delta;out.push(cur)}return out.reverse()}
function spark(vals,ref,col){if(vals.length<2)return'<div class="mut">Not enough activity yet</div>';
  const W=300,H=90,mn=Math.min(...vals,ref??Infinity),mx=Math.max(...vals,ref??-Infinity),sp=mx-mn||1,y=v=>(H-8-(v-mn)/sp*(H-16)).toFixed(1);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${y(v)}`).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;background:#fff;border:2px solid #111;border-radius:10px">${ref!=null?`<line x1="0" x2="${W}" y1="${y(ref)}" y2="${y(ref)}" stroke="#111" stroke-dasharray="4 4" opacity=".35"/>`:''}<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${W}" cy="${y(vals[vals.length-1])}" r="4" fill="${col}"/></svg><div class="ln" style="border:0;padding:2px 0"><span class="mut">low ${mn}</span>${ref!=null?'<span class="mut">- - start</span>':''}<span class="mut">high ${mx}</span></div>`}
function gameBoard(){
  const done=S.bets.filter(b=>b.status==='settled');if(!done.length)return'';
  const games=[...new Set(done.map(b=>b.game).filter(Boolean))].sort();if(gameSel!=='All'&&!games.includes(gameSel))gameSel='All';
  const st={};done.filter(b=>gameSel==='All'||b.game===gameSel).forEach(b=>S.entries.filter(e=>e.bet_id===b.id).forEach(e=>{
    const s=st[e.player_id]=st[e.player_id]||{n:0,w:0,net:0};s.n++;if((e.payout||0)>0)s.w++;s.net+=(e.payout||0)-e.stake}));
  const rows=Object.entries(st).map(([id,s])=>({id:+id,...s})).sort((a,b)=>b.net-a.net||b.w-a.w).slice(0,10);
  return`<div class="card"><h3>🎮 Game leaderboard</h3><div class="row"><select id="gsel" onchange="gameSel=this.value;render()"><option>All</option>${games.map(g=>`<option${g===gameSel?' selected':''}>${esc(g)}</option>`).join('')}</select></div>
  ${rows.map((r,i)=>`<div class="lb"><b>${['🥇','🥈','🥉'][i]||'#'+(i+1)}</b><span>${esc(nm(r.id))}<div class="mut">${r.w}W · ${r.n-r.w}L</div></span><b style="width:auto">${sg(r.net)}</b></div>`).join('')}</div>`}
window.qs=n=>{$('#vs').value=n};

function render(){
  const m={};document.querySelectorAll('#app [id]').forEach(el=>{if(/INPUT|SELECT|TEXTAREA/.test(el.tagName))m[el.id]=el.type==='checkbox'?el.checked:el.value});
  const ae=document.activeElement,fid=ae&&ae.id&&ae.closest('#app')?ae.id:null,ss=fid?ae.selectionStart:null;
  if(TV){$('#app').innerHTML=`<div class="top"><h1>PARTY BANK</h1><div class="row" style="margin:0">${dotH()}${sndH()}<span class="coin">🏦 ${S.bank}🪙</span></div></div><div class="wrap tv">${podium()}${top10()}${activity(8)}</div>`;return}
  const staff=!!role,sup=role==='super';
  let v='';
  if(tab==='home'){
    const tot=S.players.reduce((a,p)=>a+p.balance,0),live=S.bets.filter(b=>b.status==='open'||b.status==='locked').length;

    ${top10()}
    ${best?`<div class="card"><h3>Highlights</h3><div class="ln"><span>🚀 Biggest gain</span><b>${esc(best.name)} ${sg(best.net-START)}</b></div><div class="ln"><span>📉 Biggest drop</span><b>${esc(worst.name)} ${sg(worst.net-START)}</b></div></div>`:''}
    ${awardsCard()}${staff?shareCard():''}${activity(12)}`;
  }else if(tab==='people'){
    const q=Q.trim().toLowerCase(),list=byName().filter(p=>p.name.toLowerCase().includes(q));
    v=`${viewP&&S.players.find(p=>p.id===viewP)?pdetail(viewP):''}<div class="card"><h2>👥 Everyone (${S.players.length})</h2><div class="row"><input id="q" placeholder="Search name…" value="${esc(Q)}" oninput="Q=this.value;render()" style="width:100%"></div>
    ${list.map(p=>`<div class="lb" onclick="openP(${p.id})" style="cursor:pointer"><span>${esc(p.name)}${p.loan?` <small class="mut">🆘 owes ${p.loan}</small>`:''}</span><b style="width:auto">${p.balance}🪙</b><small>${sg(p.balance-(p.loan||0)-START)}</small></div>`).join('')||'<div class="mut" style="margin-top:8px">No players found</div>'}</div>`;
  }else if(tab==='eco'){v=ecoView();
  }else if(tab==='bets'){
    v=gameBoard()+(S.bets.length?S.bets.map(b=>betCard(b,false)).join(''):'<div class="card">No bets yet. Hang tight! 🎲</div>');
  }else if(!staff){
    v=`<div class="card" style="margin-top:40px;background:var(--y)"><h2>🔑 Host</h2><div class="row"><input id="sc" type="password" placeholder="Super admin or co-host code"><button class="g" onclick="unlock()">Unlock</button></div></div>`;
  }else{
    const open=S.bets.filter(b=>b.status==='open'||b.status==='locked'),done=S.bets.filter(b=>b.status==='settled'||b.status==='void');
    const po=byName().map(p=>`<option value="${p.id}">${esc(p.name)} (${p.balance})</option>`).join(''),la=lastAdj(),pz=S.ev.prizes||[],lo=byName().filter(p=>p.balance<50&&!p.loan_taken).map(p=>`<option value="${p.id}">${esc(p.name)} (${p.balance})</option>`).join('');
    v=`<div class="row" style="justify-content:space-between"><span class="badge ${role}">${sup?'👑 Super admin':'🤝 Co-host'}</span><button onclick="lock()">Lock host mode</button></div>
    ${sup?'':`<div class="card" style="background:var(--y)"><b>🤝 Co-host mode</b><div class="mut" style="opacity:.8">You can do everything except <b>Event settings</b> (prizes, max stake, end event) and <b>Start clean</b> (reset / delete everything). Those two are super-admin only.</div></div>`}
    ${S.ev.ended?`<div class="card" style="background:var(--g)"><b>🏁 Event ended</b><div class="mut" style="opacity:.8">New bets are blocked.${sup?' Reopen it from Event settings below.':''}</div></div>`:''}
    <div class="card" style="background:var(--c)"><h3>➕ Add players</h3><div class="mut" style="opacity:.8">One name per line. Each gets ${START} tokens.</div><div class="row"><textarea id="np" placeholder="Ravi&#10;Anita&#10;Kiran"></textarea></div><div class="row"><button class="g" onclick="addp()">Add to party</button></div></div>
    ${staff?`<div class="card"><h3>💰 Add / deduct tokens</h3><div class="row">${byName().map(p=>`<label class="chip"><input type="checkbox" id="pk${p.id}">${esc(p.name)} · ${p.balance}</label>`).join('')||'<span class="mut">No players yet</span>'}</div>
    <div class="row"><button onclick="pickAll(true)">Select all</button><button onclick="pickAll(false)">Clear</button></div>
    <div class="row"><button class="r" onclick="preset(-200,'Late arrival')">⏰ Late −200</button><button class="g" onclick="preset(100,'Early bird bonus')">🐦 Early +100</button></div>
    <div class="row"><input id="ad" type="number" placeholder="+/- tokens" style="width:120px"><input id="ar" placeholder="Reason" style="flex:1"><button class="g" onclick="adj()">Apply</button></div>
    <div class="row"><button onclick="undoAdj()"${la?'':' disabled'}>↩ Undo last adjustment</button><span class="mut">${la?la.txt:'Nothing to undo yet'}</span></div></div>`:''}
    <div class="card" style="background:var(--v)"><h3 style="color:#fff">⚔️ New duel</h3><div class="mut" style="color:#fff">Pick a player, an opponent (or the Bank) and a stake. Winner gets double. Max stake: ${S.ev.max_stake||'no limit'}.</div><div class="row"><select id="vg">${GAMES.map(g=>`<option>${esc(g)}</option>`).join('')}</select><input id="vs" type="number" min="1" placeholder="stake" style="width:100px"></div><div class="row">${[50,100,250,500].map(n=>`<button class="c" onclick="qs(${n})"${S.ev.max_stake>0&&n>S.ev.max_stake?' disabled':''}>${n}</button>`).join('')}</div><div class="row"><select id="va">${po}</select><b style="color:#fff">VS</b><select id="vb"><option value="bank">🏦 Bank</option>${po}</select></div><div class="row"><input id="vt" placeholder="Title (optional)" style="width:100%"></div><div class="row"><button class="g" onclick="mkduel()">Start duel</button></div></div>
    <h2>Live bets</h2>${open.map(b=>betCard(b,true)).join('')||'<div class="card">No live bets</div>'}<h2>Finished</h2>${done.map(b=>betCard(b,true)).join('')}
    ${staff?`<div class="card" style="background:var(--y)"><h3>🏦 Bank wallet: ${S.bank}🪙</h3><div class="row"><input id="bka" type="number" min="1" placeholder="tokens" style="width:110px"><input id="bkr" placeholder="Reason (optional)" style="flex:1"></div><div class="row"><button class="g" onclick="bankAdj(1)">➕ Add to bank</button><button class="r" onclick="bankAdj(-1)">➖ Remove</button></div></div>
    <div class="card"><h3>🆘 Rescue loan</h3><div class="mut">One-time loan of 100 tokens from the bank, only for players under 50 tokens. Counts against their ranking until repaid.</div>${lo?`<div class="row"><select id="lp">${lo}</select><button class="c" onclick="loan()">Give 100 loan</button></div>`:'<div class="mut" style="margin-top:8px">No eligible player right now (under 50 tokens and no loan taken yet).</div>'}
    ${S.players.filter(p=>p.loan>0).map(p=>`<div class="ln"><span>${esc(p.name)} owes <b>${p.loan}</b></span><button onclick="repay(${p.id})">Repay</button></div>`).join('')}</div>
    `:''}
    ${sup?`<div class="card"><h3>🏁 Event settings</h3><div class="row"><span>Max stake per bet</span><input id="ms" type="number" min="0" value="${S.ev.max_stake||0}" style="width:100px"><span class="mut">0 = no limit</span></div>
    <div class="mut" style="margin-top:10px">Prizes are optional real-world rewards (e.g. “Chocolate box”). They show under the winners’ names on the podium and in the ceremony. The winners themselves are picked automatically from the leaderboard.</div><div class="row"><input id="pz1" placeholder="🥇 1st prize (optional)" value="${esc(pz[0]||'')}" style="width:100%"><input id="pz2" placeholder="🥈 2nd prize (optional)" value="${esc(pz[1]||'')}" style="width:100%"><input id="pz3" placeholder="🥉 3rd prize (optional)" value="${esc(pz[2]||'')}" style="width:100%"></div>
    <div class="row"><button class="g" onclick="saveEv()">Save</button><button onclick="clearPz()">Clear prizes</button>${S.ev.ended?'<button class="c" onclick="ceremony()">🏅 Replay ceremony</button>':''}${S.ev.ended?'<button onclick="endEv(false)">Reopen event</button>':'<button class="r" onclick="endEv(true)">🏁 End event</button>'}</div></div>`:''}
    <div class="card"><h3>💾 Backup</h3><div class="mut">Download a copy in case anything goes wrong mid-party.</div><div class="row"><button onclick="bkBal()">Balances CSV</button><button onclick="bkLed()">Full history CSV</button></div></div>
    ${staff?`<div class="card"><h3>Players</h3>${byName().map(p=>`<div class="ln"><span>${esc(p.name)} <small class="mut">${p.balance}🪙</small></span><button class="r" style="padding:2px 8px" onclick="rmp(${p.id})">✕</button></div>`).join('')}</div>
    `:''}
    ${sup?`<div class="card" style="background:var(--r)"><h3>🧹 Start clean</h3><div class="mut" style="color:#111">Wipe test data before the real event.</div><div class="row"><button onclick="resetEv(true)">Reset tokens &amp; bets (keep players)</button><button onclick="resetEv(false)">Delete everything</button></div></div>`:''}`;
  }
  const tabs=[['home','🏠','Home'],['people','👥','People'],['eco','💱','Economy'],['bets','🎲','Bets'],['host',staff?'🎮':'🔑','Host']];
  $('#app').innerHTML=`<div class="top"><h1>PARTY BANK</h1><div class="row" style="margin:0">${staff?`<span class="badge ${role}">${sup?'👑 Super':'🤝 Co-host'}</span>`:''}${dotH()}${sndH()}<span class="coin">🏦 ${S.bank}🪙</span></div></div><div class="wrap">${v}</div><nav>${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
  for(const id in m){const el=document.getElementById(id);if(el){if(el.type==='checkbox')el.checked=m[id];else el.value=m[id]}}
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(ss,ss)}catch(e){}}}
}
