<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Bank 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--bg:#fff3d6;--y:#ffd93d;--p:#ff6b9d;--c:#4ecdc4;--v:#9b5de5;--g:#7bd88f;--r:#ff5a4f}
*{box-sizing:border-box}
body{margin:0;font:600 16px 'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--bg) radial-gradient(#0002 1.5px,transparent 1.5px) 0 0/22px 22px;padding-bottom:96px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
h1,h2,h3{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0}
h3{font-size:18px}
.top{position:sticky;top:0;z-index:5;background:var(--p);border-bottom:4px solid var(--ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-size:22px;transform:rotate(-1.5deg)}
.coin{background:var(--y);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;box-shadow:3px 3px 0 var(--ink);font-weight:700;white-space:nowrap}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin:16px 0}
.big{font:400 56px Bungee,Impact,sans-serif;line-height:1}
button,input,select,textarea{font:inherit;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--y);box-shadow:3px 3px 0 var(--ink);font-weight:700}
button:active{transform:translate(3px,3px);box-shadow:none}
button.g{background:var(--g)}button.r{background:var(--r)}button.x{padding:2px 8px;background:var(--r);box-shadow:2px 2px 0 var(--ink)}button.c{background:var(--c)}
textarea{width:100%;min-height:80px}input{min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--c);font-size:14px}
.chip.win{background:var(--y);box-shadow:2px 2px 0 var(--ink)}
.badge{border:2px solid var(--ink);border-radius:8px;padding:1px 8px;font-size:13px;text-transform:uppercase;background:var(--g)}
.badge.locked{background:var(--y)}.badge.settled{background:var(--c)}.badge.void{background:#ccc}.badge.super{background:var(--v);color:#fff}.badge.admin{background:var(--p)}
.ln{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed #0003;font-size:15px}
.mut{opacity:.6;font-size:14px}.pos{color:#0a7d3b}.neg{color:#c4271d}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;justify-content:center;padding:10px;background:var(--v);border-top:4px solid var(--ink)}
nav button{flex:1;max-width:130px;padding:8px 4px;font-size:14px}nav button.on{background:var(--p)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9;background:var(--g);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:8px 16px;display:none}
#toast.err{background:var(--r)}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #0003}.lb b{font:400 20px Bungee;width:44px}.lb span{flex:1}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://eudtnaprxmjbhrkhupbg.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1ZHRuYXByeG1qYmhya2h1cGJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1Nzc5ODcsImV4cCI6MjExMDE1Mzk4N30.iv8E6kXyKNiIVvKSQuR1i6jTdRO4cc_QzvyV92FtebA';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GAMES=['Flip 7','Exploding Kittens','Blackjack','Least Count','Mafia','Trivia Quiz',"Don't Say Same Thing",'Whole Party','Other'];
const START=1000;
let S={me:null,players:[],bank:0,bets:[],entries:[],ledger:[]},uid,tab='home',timer,dirty=false;
const nm=id=>id?(S.players.find(p=>p.id===id)?.name||'?'):'🏦 Bank';
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const sg=n=>`<span class="${n>=0?'pos':'neg'}">${n>0?'+':''}${n}</span>`;

function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
async function rpc(fn,args){const {error}=await sb.rpc(fn,args);if(error){toast(error.message,1);return false}toast('Done ✔');await load();return true}

async function init(){
  const {data}=await sb.auth.getSession();
  if(data.session)uid=data.session.user.id;
  else{const r=await sb.auth.signInAnonymously();
    if(r.error){$('#app').innerHTML='<div class="wrap"><div class="card">Turn on <b>Anonymous sign-ins</b> in Supabase → Authentication → Providers.<br>'+esc(r.error.message)+'</div></div>';return}
    uid=r.data.user.id}
  await load();
  sb.channel('party').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(timer);timer=setTimeout(load,300)}).subscribe();
}
async function load(){
  const [p,b,bt,e,l]=await Promise.all([sb.from('profiles').select('*'),sb.from('bank').select('balance').single(),
    sb.from('bets').select('*').order('id',{ascending:false}),sb.from('entries').select('*'),
    sb.from('ledger').select('*').order('id',{ascending:false}).limit(400)]);
  S.players=p.data||[];S.bank=b.data?.balance??0;S.bets=bt.data||[];S.entries=e.data||[];S.ledger=l.data||[];
  S.me=S.players.find(x=>x.id===uid)||null;render();
}

window.join=async()=>{const n=$('#jn').value.trim();if(!n)return toast('Type your name!',1);
  const {error}=await sb.rpc('join_party',{p_name:n});
  if(error)return toast(/duplicate/.test(error.message)?'That name is taken!':error.message,1);load()};
window.claim=()=>rpc('claim_super',{p_code:$('#sc').value});
window.mk=async()=>{
  const opts=$('#bo').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*@\s*([\d.]+)$/);return{label:m?m[1]:x,odds:Math.max(1,m?+m[2]:2)}});
  const title=$('#bt').value.trim();if(!title||opts.length<2)return toast('Need a title and 2+ options',1);
  if(await rpc('create_bet',{p_game:$('#bg').value,p_title:title,p_mode:$('#bm').value,p_options:opts})){$('#bt').value='';$('#bo').value=''}};
window.fillPl=()=>{$('#bo').value=S.players.map(p=>p.name+($('#bm').value==='bank'?' @'+Math.max(2,S.players.length):'')).join('\n')};
window.place=id=>{const s=parseInt($('#st'+id).value);if(!(s>0))return toast('Enter a stake',1);
  rpc('place_entry',{p_bet:id,p_player:$('#pl'+id).value,p_opt:+$('#op'+id).value,p_stake:s})};
window.settle=id=>{const w=$('#w'+id);if(confirm('Settle: "'+w.options[w.selectedIndex].text+'" wins?'))rpc('settle_bet',{p_bet:id,p_win:+w.value})};
window.voidB=id=>{if(confirm('Void bet and refund everyone?'))rpc('void_bet',{p_bet:id})};
window.adj=()=>{const d=parseInt($('#ad').value);if(!d)return toast('Enter an amount',1);
  rpc('adjust',{p_player:$('#ap').value||null,p_delta:d,p_reason:$('#ar').value})};

function ctl(b,sup){
  if(b.status==='void')return'';
  if(b.status==='settled')return sup?`<div class="row"><button onclick="rpc('reopen_bet',{p_bet:${b.id}})">↩ Undo result</button></div>`:'';
  const oo=b.options.map((o,i)=>`<option value="${i}">${esc(o.label)}</option>`).join('');
  const pl=[...S.players].sort((a,c)=>a.name.localeCompare(c.name)).map(p=>`<option value="${p.id}">${esc(p.name)} (${p.balance})</option>`).join('');
  return(b.status==='open'?`<div class="row"><select id="pl${b.id}">${pl}</select><select id="op${b.id}">${oo}</select><input id="st${b.id}" type="number" min="1" placeholder="stake" style="width:90px"><button class="c" onclick="place(${b.id})">Place bet</button></div>`:'')+
  `<div class="row"><button onclick="rpc('set_status',{p_bet:${b.id},p_status:'${b.status==='open'?'locked':'open'}'})">${b.status==='open'?'🔒 Lock':'🔓 Reopen betting'}</button><select id="w${b.id}">${oo}</select><button class="g" onclick="settle(${b.id})">🏁 Settle</button><button class="r" onclick="voidB(${b.id})">Void</button></div>`;
}
function betCard(b,desk,sup){
  const es=S.entries.filter(e=>e.bet_id===b.id),L=b.options.map(o=>esc(o.label)),tot=es.reduce((a,e)=>a+e.stake,0);
  const chips=b.options.map((o,i)=>{const t=es.filter(e=>e.opt===i).reduce((a,e)=>a+e.stake,0);
    return`<span class="chip${b.winning===i?' win':''}">${b.winning===i?'👑 ':''}${L[i]}${b.mode==='bank'?' ×'+o.odds:''} · ${t}</span>`}).join('');
  const list=es.map(e=>`<div class="ln"><span>${esc(nm(e.player_id))} → ${L[e.opt]} · ${e.stake}🪙${e.payout!=null?` ⇒ <b>${e.payout}</b>`:''}</span>${desk&&b.status==='open'?`<button class="x" onclick="rpc('cancel_entry',{p_entry:${e.id}})">✕</button>`:''}</div>`).join('')||'<div class="mut">No bets yet</div>';
  return`<div class="card"><div class="row" style="justify-content:space-between;margin:0"><h3>${esc(b.game)}</h3><span class="badge ${b.status}">${b.status}</span></div><div style="margin-top:4px">${esc(b.title)}</div><div class="mut">${b.mode==='bank'?'🏦 vs Bank · fixed odds':'🤝 Pool · winners split the pot'} · pot ${tot}🪙</div><div class="row">${chips}</div><div style="margin-top:8px">${list}</div>${desk?ctl(b,sup):''}</div>`;
}

function render(){
  const ae=document.activeElement;
  if(ae&&ae.closest('#app')&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)){dirty=true;return}
  const a=$('#app');
  if(!S.me){a.innerHTML=`<div class="wrap"><div class="card" style="margin-top:40px;background:var(--y)"><h2>🎉 Party Bank</h2><p>Everyone starts with ${START} house tokens. Pick your name to join!</p><div class="row"><input id="jn" placeholder="Your name" maxlength="20"><button class="g" onclick="join()">Let me in!</button></div></div></div>`;return}
  const me=S.me,staff=me.role!=='member',sup=me.role==='super';
  if((tab==='desk'||tab==='admin')&&!staff)tab='home';
  const sorted=[...S.players].sort((x,y)=>y.balance-x.balance),rank=sorted.findIndex(p=>p.id===me.id)+1;
  let v='';
  if(tab==='home'){
    const mine=S.ledger.filter(l=>l.player_id===me.id);
    v=`<div class="card" style="background:var(--c)"><div class="mut" style="opacity:.8">YOUR WALLET</div><div class="big">${me.balance}🪙</div><div class="row"><span class="chip">Rank #${rank} of ${S.players.length}</span><span class="chip">${sg(me.balance-START)} vs start</span></div></div>
    <div class="card"><h3>Where my tokens went</h3>${mine.map(l=>`<div class="ln"><span>${esc(l.reason)}<div class="mut">${tm(l.created_at)}</div></span><b>${sg(l.delta)}</b></div>`).join('')||'<div class="mut">Nothing yet</div>'}</div>
    ${sup?'':`<details class="card"><summary>🔑 I'm the host</summary><div class="row"><input id="sc" type="password" placeholder="Host code"><button onclick="claim()">Unlock</button></div></details>`}`;
  }else if(tab==='bets'){
    v=S.bets.length?S.bets.map(b=>betCard(b,false,false)).join(''):'<div class="card">No bets yet. Hang tight! 🎲</div>';
  }else if(tab==='board'){
    v=`<div class="card" style="background:var(--y)"><h2>🏆 Leaderboard</h2>${sorted.map((p,i)=>`<div class="lb"><b>${['🥇','🥈','🥉'][i]||'#'+(i+1)}</b><span>${esc(p.name)}${p.id===me.id?' (you)':''}</span><b style="width:auto">${p.balance}🪙</b><small>${sg(p.balance-START)}</small></div>`).join('')}</div><div class="card"><h3>🏦 Bank: ${S.bank}🪙</h3></div>`;
  }else if(tab==='desk'){
    const open=S.bets.filter(b=>b.status==='open'||b.status==='locked'),done=S.bets.filter(b=>b.status==='settled'||b.status==='void');
    v=`<div class="card" style="background:var(--p)"><h3>➕ New bet</h3><div class="row"><select id="bg">${GAMES.map(g=>`<option>${esc(g)}</option>`).join('')}</select><select id="bm"><option value="bank">🏦 vs Bank (odds)</option><option value="pool">🤝 Pool / PvP</option></select></div><div class="row"><input id="bt" placeholder="Who wins round 1?" style="width:100%"></div><div class="row"><textarea id="bo" placeholder="One option per line.&#10;Bank mode odds: Ravi @2.5&#10;Pool mode: Ravi"></textarea></div><div class="row"><button onclick="fillPl()">👥 Use all players</button><button class="g" onclick="mk()">Create bet</button></div></div>
    <h2>Live bets</h2>${open.map(b=>betCard(b,true,sup)).join('')||'<div class="card">No live bets</div>'}<h2>Finished</h2>${done.map(b=>betCard(b,true,sup)).join('')}`;
  }else{
    const opts=`<option value="">🏦 Bank</option>`+sorted.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
    v=`<div class="card" style="background:var(--c)"><h2>🏦 Bank: ${S.bank}🪙</h2></div>`+(sup?`<div class="card"><h3>Adjust tokens</h3><div class="row"><select id="ap">${opts}</select><input id="ad" type="number" placeholder="+/- tokens" style="width:120px"></div><div class="row"><input id="ar" placeholder="Reason (optional)" style="flex:1"><button class="g" onclick="adj()">Apply</button></div></div>
    <div class="card"><h3>Team</h3>${sorted.map(p=>`<div class="ln"><span>${esc(p.name)} <small class="mut">${p.balance}🪙</small></span>${p.role==='super'?'<span class="badge super">super</span>':`<select onchange="rpc('set_role',{p_player:'${p.id}',p_role:this.value})"><option value="member"${p.role==='member'?' selected':''}>member</option><option value="admin"${p.role==='admin'?' selected':''}>admin</option></select>`}</div>`).join('')}</div>`:'')+
    `<div class="card"><h3>Activity</h3>${S.ledger.slice(0,50).map(l=>`<div class="ln"><span>${esc(nm(l.player_id))}: ${esc(l.reason)}<div class="mut">${tm(l.created_at)}</div></span><b>${sg(l.delta)}</b></div>`).join('')}</div>`;
  }
  const tabs=[['home','🏠 Me'],['bets','🎲 Bets'],['board','🏆 Board']].concat(staff?[['desk','🎮 Desk'],['admin','⚙️ Admin']]:[]);
  a.innerHTML=`<div class="top"><h1>PARTY BANK</h1><div class="row" style="margin:0">${me.role!=='member'?`<span class="badge ${me.role}">${me.role}</span>`:''}<span class="coin">${esc(me.name)} · ${me.balance}🪙</span></div></div><div class="wrap">${v}</div><nav>${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav>`;
}
document.addEventListener('focusout',()=>{if(dirty){dirty=false;setTimeout(render,150)}});
init();
</script></body></html>
